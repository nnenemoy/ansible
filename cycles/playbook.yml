- hosts: webservers
  vars:
    users:
      - jaime
      - sansa
      - robert
  tasks:
    - name: git install
      ansible.builtin.apt:
        name: git
        state: latest
      become: yes

    - name: add users
      ansible.builtin.user:
        name: "{{ item }}"
      loop: "{{ users }}"

    - name: update .gitconfig
      ansible.builtin.template:
        src: templates/.gitconfig.j2
        dest: "/home/{{ item }}/.gitconfig"
      loop: "{{ users }}"

    - name: create .ssh
      ansible.builtin.file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        mode: '755'
      loop: "{{ users }}"

    - name: add pub_ssh_key
      ansible.builtin.template:
        src: files/authorized_keys
        dest: "/home/{{ item }}/.ssh/authorized_keys"
      loop: "{{ users }}"
